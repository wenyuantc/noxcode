[package]
name = "noxcode"
version = "0.5.3"
description = "noxcode"
authors = ["you"]
edition = "2021"

[lib]
name = "noxcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tempfile = "3"
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-dialog = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "net", "sync", "time", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# SQLiteQuery uses the locked SQLx handle for SQLite's authorizer API.
sqlx = { version = "=0.8.6", features = ["sqlite", "runtime-tokio", "macros"] }
libsqlite3-sys = "=0.30.1"
libc = "0.2"
tauri-plugin-notification = "2.4.0"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
ssh2-config = "0.8"
# xcap 0.6+ 需要 edition 2024 / 更新的 rustc；0.4.1 覆盖 X11 / Wayland / macOS / Windows。
xcap = "=0.4.1"
# 默认 feature `xdo` 会链 libxdo（运行时外部依赖）。Linux 改走纯 Rust 的 x11rb。
enigo = { version = "=0.3.0", default-features = false, features = ["x11rb"] }
# 0.25.8+ 抬高 MSRV；钉在 1.83 可编译的 0.25.6。
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = { version = "0.45.0", default-features = false }
calamine = "0.26.1"
cfb = "0.7"
pdfium-render = { version = "0.9.4", default-features = false, features = ["image_025", "thread_safe", "pdfium_latest"] }

[features]
default = []
media-faults = []

# 后台电脑控制：只增加已在 lockfile 里的 crate，不引入新的运行时外部命令。
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
foreign-types = "0.5"

[dev-dependencies]
# Local-only HTTPS fixtures; keep the same ring TLS backend as production.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rand = "0.10"
tokio = { version = "1", features = ["test-util"] }
