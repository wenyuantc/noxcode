<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noxcode</title>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("theme-mode");
          const legacyTheme = localStorage.getItem("theme");
          const isThemeMode = mode === "light" || mode === "dark" || mode === "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const effectiveMode = isThemeMode
            ? mode
            : legacyTheme === "light" || legacyTheme === "dark"
              ? legacyTheme
              : "system";
          const isDark = effectiveMode === "dark" || (effectiveMode === "system" && prefersDark);

          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";

          const uiFont = Number(localStorage.getItem("noxcode:ui-font-size"));
          const codeFont = Number(localStorage.getItem("noxcode:code-font-size"));
          document.documentElement.style.setProperty(
            "--ui-font-size",
            Number.isFinite(uiFont) && uiFont >= 12 && uiFont <= 20 ? `${uiFont}px` : "14px",
          );
          document.documentElement.style.setProperty(
            "--code-font-size",
            Number.isFinite(codeFont) && codeFont >= 10 && codeFont <= 22
              ? `${codeFont}px`
              : "12px",
          );
        } catch {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
          document.documentElement.style.setProperty("--ui-font-size", "14px");
          document.documentElement.style.setProperty("--code-font-size", "12px");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
